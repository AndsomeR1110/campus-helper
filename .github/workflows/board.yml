name: Board

# Publishes the project board (board/site) to GitHub Pages. The page reads
# issues and PRs from the GitHub API in the browser, so it only needs
# redeploying when the board's own code changes.
on:
  push:
    branches: [main]
    paths: ["board/site/**", ".github/workflows/board.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: board/site
      - id: deployment
        uses: actions/deploy-pages@v4
