<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>CAMPUS HELPER · 项目看板</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M41.5 23.5a12 12 0 1 0 0 17' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div>
          <h1>CAMPUS HELPER 项目看板</h1>
          <p class="muted" id="updated">正在读取 GitHub…</p>
        </div>
        <div class="actions">
          <button type="button" class="btn secondary" id="refresh">刷新</button>
          <a class="btn primary" id="new-task" target="_blank" rel="noopener">布置新任务</a>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="error" class="alert" role="alert" hidden></div>

      <section aria-labelledby="overview-title" class="section">
        <h2 id="overview-title" class="section-title">总体进度</h2>
        <div class="stats" id="stats"></div>
      </section>

      <section aria-labelledby="members-title" class="section">
        <h2 id="members-title" class="section-title">成员</h2>
        <div class="members" id="members"></div>
      </section>

      <section aria-labelledby="board-title" class="section">
        <div class="section-head">
          <h2 id="board-title" class="section-title">任务</h2>
          <div class="chips" role="group" aria-label="按成员筛选" id="filters"></div>
        </div>
        <div class="board" id="board"></div>
      </section>

      <div class="two-col">
        <section aria-labelledby="pulls-title" class="section">
          <h2 id="pulls-title" class="section-title">开着的 PR</h2>
          <ul class="list" id="pulls"></ul>
        </section>
        <section aria-labelledby="merged-title" class="section">
          <h2 id="merged-title" class="section-title">最近合并</h2>
          <ul class="list" id="merged"></ul>
        </section>
      </div>

      <footer class="muted footer">
        数据实时来自 GitHub：带 <code>task</code> 标签的 Issue 是任务。负责人看
        <code>owner:M1</code>–<code>owner:M5</code> 标签；状态：Issue 关闭 = 已完成，有开着的 PR
        写了 <code>Closes #编号</code> = 审查中，<code>status:in-progress</code> = 进行中，
        <code>status:blocked</code> = 阻塞。
      </footer>
    </main>
  </body>
</html>
